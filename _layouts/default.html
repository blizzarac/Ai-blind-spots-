<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="alternate" type="application/json" href="{{ '/atlas.json' | relative_url }}" title="Machine-readable atlas index">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #666666;
      --border: #e0e0e0;
      --accent: #0b57d0;
      --code-bg: #f5f5f5;
      --badge-high: #b3261e;
      --badge-medium: #9a6700;
      --badge-low: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --fg: #e6e6e6;
        --muted: #9a9a9a;
        --border: #33363c;
        --accent: #8ab4f8;
        --code-bg: #1f2228;
        --badge-high: #f2857c;
        --badge-medium: #e0b04b;
        --badge-low: #6bc57e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    header.site {
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
    }
    header.site nav {
      max-width: 46rem; margin: 0 auto;
      display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap;
    }
    header.site a.brand { font-weight: 700; color: var(--fg); text-decoration: none; }
    header.site a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    header.site a:hover { color: var(--accent); }
    a { color: var(--accent); }
    h1 { font-size: 1.6rem; line-height: 1.25; }
    h2 { font-size: 1.15rem; margin-top: 2.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.88em;
      background: var(--code-bg);
      border-radius: 4px;
    }
    code { padding: 0.1em 0.35em; }
    pre { padding: 0.8rem 1rem; overflow-x: auto; }
    pre code { padding: 0; background: none; }
    blockquote {
      margin: 1rem 0; padding: 0.2rem 1rem;
      border-left: 3px solid var(--accent);
      color: var(--muted);
    }
    table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--border); padding: 0.4rem 0.7rem; text-align: left; }
    .badge {
      display: inline-block; font-size: 0.75rem; font-weight: 600;
      padding: 0.05rem 0.5rem; border-radius: 999px;
      border: 1px solid currentColor;
    }
    .badge.severity-high { color: var(--badge-high); }
    .badge.severity-medium { color: var(--badge-medium); }
    .badge.severity-low { color: var(--badge-low); }
    .badge.cat { color: var(--muted); }
    .meta { color: var(--muted); font-size: 0.85rem; }
    ul.entry-list { list-style: none; padding: 0; }
    ul.entry-list li {
      padding: 0.7rem 0; border-bottom: 1px solid var(--border);
    }
    ul.entry-list li a.entry-title { font-weight: 600; text-decoration: none; }
    ul.entry-list li p { margin: 0.25rem 0 0.4rem; color: var(--muted); font-size: 0.92rem; }
    footer {
      max-width: 46rem; margin: 0 auto; padding: 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted); font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header class="site">
    <nav>
      <a class="brand" href="{{ '/' | relative_url }}">Blind Spot Atlas</a>
      {% for cat in site.data.categories %}<a href="{{ '/categories/' | append: cat[0] | append: '/' | relative_url }}">{{ cat[1].title }}</a>{% endfor %}
      <a href="{{ '/atlas.json' | relative_url }}">atlas.json</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    Every published entry carries a dated, reproducible example — entries without one live in
    <a href="https://github.com/blizzarac/Ai-blind-spots-/tree/main/drafts">drafts/</a> and don't publish.
    <a href="https://github.com/blizzarac/Ai-blind-spots-/blob/main/CONTRIBUTING.md">Contribute</a>.
  </footer>
</body>
</html>
